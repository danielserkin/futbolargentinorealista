name: Actualizar datos y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '17 4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_ADSENSE_CLIENT: ca-pub-4747589340489317
      VITE_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      VITE_ADSENSE_ENABLED: ${{ vars.ADSENSE_ENABLED }}
      VITE_AD_PROVIDER: ${{ vars.AD_PROVIDER }}
      VITE_ADS_ENABLED: ${{ vars.ADS_ENABLED }}
      VITE_ADSTERRA_DESKTOP_KEY: ${{ vars.ADSTERRA_DESKTOP_KEY }}
      VITE_ADSTERRA_DESKTOP_SCRIPT: ${{ vars.ADSTERRA_DESKTOP_SCRIPT }}
      VITE_ADSTERRA_MOBILE_KEY: ${{ vars.ADSTERRA_MOBILE_KEY }}
      VITE_ADSTERRA_MOBILE_SCRIPT: ${{ vars.ADSTERRA_MOBILE_SCRIPT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Actualizar partidos recientes
        if: github.event_name == 'schedule' && github.event.schedule == '7,37 * * * *'
        run: npm run fetch-data -- --mode=recent --base-url=https://futbolrealista.com.ar/data/football.json
      - name: Descargar historial completo
        if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * *'
        run: npm run fetch-data -- --mode=full
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

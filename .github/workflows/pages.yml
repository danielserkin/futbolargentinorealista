name: Actualizar datos y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '17 4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_ADSENSE_CLIENT: ca-pub-4747589340489317
      VITE_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      VITE_ADSENSE_ENABLED: ${{ vars.ADSENSE_ENABLED }}
      # Las claves de unidad son identificadores públicos incluidos en el código
      # que recibe el navegador; no son credenciales de la cuenta de publisher.
      VITE_AD_PROVIDER: adsterra
      VITE_ADS_ENABLED: true
      VITE_ADSTERRA_DESKTOP_KEY: a7a339e0dd5f5bab6b60562ae8566a9a
      VITE_ADSTERRA_DESKTOP_SCRIPT: https://www.highrevenueformat.com/a7a339e0dd5f5bab6b60562ae8566a9a/invoke.js
      VITE_ADSTERRA_MOBILE_KEY: d1385a1841db6074b34f310da3b70a9d
      VITE_ADSTERRA_MOBILE_SCRIPT: https://www.highrevenueformat.com/d1385a1841db6074b34f310da3b70a9d/invoke.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Actualizar partidos recientes
        if: github.event_name == 'schedule' && github.event.schedule == '7,37 * * * *'
        run: npm run fetch-data -- --mode=recent --base-url=https://futbolrealista.com.ar/data/football.json
      - name: Descargar historial completo
        if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * *'
        run: npm run fetch-data -- --mode=full
      - run: npm test
      - name: Preparar verificación del dominio y cambios para buscadores
        run: node scripts/search-indexing.mjs prepare
      - run: npm run build
      - name: Guardar borradores de difusión y cambios de contenido
        uses: actions/upload-artifact@v4
        with:
          name: difusion
          path: .growth/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: difusion
          path: .growth/
      - name: Notificar sólo páginas nuevas o modificadas a IndexNow
        continue-on-error: true
        run: node scripts/search-indexing.mjs notify
      - name: Guardar comprobante del envío a buscadores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt
          path: .growth/indexnow-receipt.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
